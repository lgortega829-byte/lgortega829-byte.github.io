<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Principal</title>

  <style>
    body {
      background: linear-gradient(135deg, #000, #1a1a1a);
      color: #00ffcc;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 10px #00ffcc;
    }

    p {
      max-width: 500px;
      opacity: 0.85;
    }

    .btn {
      margin-top: 2rem;
      padding: 1rem 2rem;
      background: #00ffcc;
      border: none;
      color: #111;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: 0.3s;
    }

    .btn:hover {
      background: #ff0066;
      color: #fff;
      box-shadow: 0 0 15px #ff0066;
    }

    .eventos {
      margin-top: 3rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .eventos button {
      width: 250px;
      padding: 0.7rem;
      background: #222;
      border: 2px solid #00ffcc;
      color: #00ffcc;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .eventos button:hover {
      background: #00ffcc;
      color: #000;
      transform: scale(1.05);
    }

  </style>
</head>
<body>

  <h1>🔷 Menú Principal</h1>
  <p>
    ¡Bienvenido al menú principal!<br>
    Has demostrado una perseverancia increíble.<br><br>
    Desde aquí puedes continuar o acceder directamente a los desafíos principales.
  </p>

  <button class="btn" onclick="irAContinuar()">Continuar</button>

  <div class="eventos">
    <button onclick="go('laberinto.html')">Laberinto</button>
    <button onclick="go('frogger.html')">Frogger</button>
    <button onclick="go('snake.html')">Snake</button>
    <button onclick="go('space_invaders.html')">Space Invaders</button>
    <button onclick="go('asteroids.html')">Asteroids</button>
    <button onclick="go('boton_roto.html')">Botón Roto</button>
  </div>

  <script>
    // 🔒 BLOQUEO AUTOMÁTICO: Solo se puede entrar si unlockedMenu = true
    if (localStorage.getItem("unlockedMenu") !== "true") {
      window.location.href = "index.html";
    }

    function irAContinuar() {
      window.location.href = "error de interaccion 6.html";
    }

    function go(url) {
      window.location.href = url;
    }

  </script>
</body>
</html>
