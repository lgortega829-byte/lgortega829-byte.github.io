<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tu Premio</title>
  <style>
    body {
      background: radial-gradient(circle at center, #0f0f0f 0%, #000 100%);
      color: #00ffcc;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
       min-height: 100svh;
       height: auto;
       padding: 24px 16px;
       margin: 0;
      overflow-x: hidden;
       overflow-y: auto;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 8px #00ffcc;
    }

    p {
      max-width: 500px;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    button {
      background: #00ffcc;
      color: #111;
      border: none;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px #00ffcc66;
    }

    button:hover {
      background: #ff0066;
      color: #fff;
      box-shadow: 0 0 20px #ff006666;
      transform: scale(1.05);
    }

    .glow {
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #00ffcc; }
      to { text-shadow: 0 0 25px #ff0066; }
    }
  
/* Adaptación móvil */
*{box-sizing:border-box}html{width:100%;min-height:100%;}body{max-width:100%;}button{touch-action:manipulation;min-height:46px}canvas{max-width:calc(100vw - 20px);height:auto;touch-action:none}h1{font-size:clamp(1.05rem,4.8vw,2rem);padding:0 10px;line-height:1.3}.mobile-controls{display:none;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:8px auto 14px;max-width:480px;user-select:none}.mobile-controls button{min-width:64px;min-height:56px;background:#07363b;border:2px solid #00ffff;color:#00ffff;border-radius:12px;font-size:1.3rem;font-weight:bold;touch-action:none;-webkit-user-select:none;user-select:none}.mobile-controls button:active{background:#00ffff;color:#000}.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:6px;justify-content:center}.dpad [data-key="ArrowUp"]{grid-column:2;grid-row:1}.dpad [data-key="ArrowLeft"]{grid-column:1;grid-row:2}.dpad [data-key="ArrowDown"]{grid-column:2;grid-row:2}.dpad [data-key="ArrowRight"]{grid-column:3;grid-row:2}
@media(hover:none),(pointer:coarse){.mobile-controls{display:flex}}
@media(max-width:650px){body{overflow-x:hidden!important;overflow-y:auto!important}#gameCanvas,canvas#game{display:block;margin:8px auto!important}#continueBtn{max-width:calc(100vw - 24px)}.mobile-controls{display:flex}h1{margin:8px 0!important}}
@media(max-width:600px){h1{font-size:1.7rem}p{max-width:100%;line-height:1.5}.eventos{width:min(100%,320px);margin-top:20px}.eventos button{width:100%;min-height:48px}.btn{margin-top:14px}}
</style>
</head>
<body>
  <h1 class="glow">🎉 ¡Felicidades!</h1>
  <p>
    Has sido seleccionado entre miles de usuarios por tu perseverancia.<br>
    Solo un clic más te separa de tu premio definitivo.
  </p>
  <button id="premioBtn">Recibir mi premio</button>

  <script>
    const btn = document.getElementById("premioBtn");

    btn.addEventListener("click", () => {
      btn.textContent = "Procesando...";

      // ⭐ Desbloquear el menú principal permanentemente
      localStorage.setItem("unlockedMenu", "true");

      // ⭐ Borrar solo estados temporales
      sessionStorage.clear();
      localStorage.removeItem("clickCount");
      localStorage.removeItem("errorCount");
      localStorage.removeItem("ultimoEvento");

      // No borrar unlockedMenu, debe permanecer

      setTimeout(() => {
        window.location.href = "index.html";
      }, 2000);
    });
  </script>
</body>
</html>
