<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zona Oscura</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #0ff;
    font-family: 'Courier New', monospace;
    cursor: none;
    touch-action: manipulation;
  }

  @media (hover: none), (pointer: coarse) {
    html, body { cursor: auto; }
  }

  body {
    position: relative;
  }

  /* Efecto linterna que sigue el cursor */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(
      circle var(--radio-linterna, 130px) at var(--x, 50%) var(--y, 50%),
      rgba(255, 255, 200, 0.2) 0%,
      rgba(0, 0, 0, 0.96) 80%
    );
    transition: background 0.05s linear;
    z-index: 10;
  }

  /* Mensaje superior, siempre visible */
  h1 {
    position: absolute;
    top: 10%;
    width: 100%;
    text-align: center;
    color: #0ff;
    text-shadow: 0 0 10px #00ffff, 0 0 20px #00cccc;
    font-size: clamp(1.05rem, 5vw, 1.5rem);
    padding: 0 16px;
    line-height: 1.5;
    z-index: 5;
    pointer-events: none;
  }

  /* Botón de encendido oculto */
  #encender {
    position: absolute;
    background: #ff0066;
    color: #fff;
    border: none;
    padding: 1rem 2rem;
    min-width: 120px;
    min-height: 48px;
    max-width: calc(100vw - 32px);
    border-radius: 10px;
    font-size: 1rem;
    touch-action: manipulation;
    cursor: pointer;
    z-index: 1;
    opacity: 0;             /* Invisible por defecto */
    transition: opacity 0.3s ease;
  }

  /* El botón se revela solo cuando la linterna pasa por encima */
  #encender.visible {
    opacity: 1;
    transition: opacity 0.3s ease;
  }

  #encender:hover {
    background: #00ffcc;
    color: #000;
    transform: scale(1.05);
    box-shadow: 0 0 20px #00ffccaa;
  }

  @media (max-width: 600px) {
    body::after { --radio-linterna: 105px; }
    h1 { top: 8%; }
    #encender { padding: 14px 24px; }
  }
</style>
</head>
<body>
  <h1>🔌 Parece que alguien cortó la luz...<br> encontra el botón de encendido.</h1>
  <button id="encender">Encender</button>

  <script>
    const btn = document.getElementById('encender');

    // Coloca el botón en una posición aleatoria al cargar
    function colocarBoton() {
      const margen = 12;
      const x = margen + Math.random() * Math.max(0, window.innerWidth - btn.offsetWidth - margen * 2);
      const yMin = Math.min(window.innerHeight * 0.25, 140);
      const y = yMin + Math.random() * Math.max(0, window.innerHeight - btn.offsetHeight - yMin - margen);
      btn.style.left = `${x}px`;
      btn.style.top = `${y}px`;
    }
    colocarBoton();

    // Linterna controlada con mouse o dedo (Pointer Events).
    function moverLinterna(e) {
      document.body.style.setProperty('--x', `${e.clientX}px`);
      document.body.style.setProperty('--y', `${e.clientY}px`);

      const rect = btn.getBoundingClientRect();
      const margen = window.matchMedia('(pointer: coarse)').matches ? 125 : 100;
      const dentro =
        e.clientX > rect.left - margen &&
        e.clientX < rect.right + margen &&
        e.clientY > rect.top - margen &&
        e.clientY < rect.bottom + margen;

      if (dentro) btn.classList.add('visible');
      else btn.classList.remove('visible');
    }

    document.addEventListener('pointermove', moverLinterna, { passive: true });
    document.addEventListener('pointerdown', e => {
      moverLinterna(e);
      // En pantallas táctiles, mantener visible el botón al tocar cerca.
      if (e.pointerType === 'touch') btn.classList.add('visible');
    }, { passive: true });

    // Sonido de encendido
    function sonidoEncendido() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(440, ctx.currentTime);
      o.connect(g);
      g.connect(ctx.destination);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
      o.start();
      o.stop(ctx.currentTime + 0.6);
    }

    // Al hacer clic en el botón, redirigir a la página original
    btn.addEventListener('click', () => {
      sonidoEncendido();
      btn.textContent = "Encendiendo...";
      setTimeout(() => {
        window.location.href = 'error de interaccion 6.html';
      }, 1000);
    });
  </script>
</body>
</html>
