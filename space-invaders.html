<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Invasión Extraterrestre</title>
<style>
  body {
    background: radial-gradient(circle at center, #000010 0%, #000000 100%);
    color: #00ffff;
    font-family: "Courier New", monospace;
    text-align: center;
    overflow: hidden;
    margin: 0;
  }

  h1 {
    margin-top: 20px;
    text-shadow: 0 0 10px #00ffff;
  }

  #gameCanvas {
    display: block;
    margin: 40px auto 10px auto;
    background: #050505;
    border: 2px solid #00ffff;
    box-shadow: 0 0 20px #00ffff33;
  }

  #message {
    color: #ff3366;
    font-weight: bold;
    text-shadow: 0 0 10px #ff3366;
    margin-bottom: 15px;
    height: 30px;
  }

  #continueBtn {
    display: none;
    background: #00ffff;
    color: #000;
    border: none;
    padding: 12px 36px;
    border-radius: 10px;
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 0 20px #00ffff99;
    margin: 20px auto 0 auto;
    max-width: 80%;
  }

  #continueBtn:hover {
    background: #00cccc;
    box-shadow: 0 0 25px #00cccc;
  }

/* Adaptación móvil */
*{box-sizing:border-box}html{width:100%;min-height:100%;}body{max-width:100%;}button{touch-action:manipulation;min-height:46px}canvas{max-width:calc(100vw - 20px);height:auto;touch-action:none}h1{font-size:clamp(1.05rem,4.8vw,2rem);padding:0 10px;line-height:1.3}.mobile-controls{display:none;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:8px auto 14px;max-width:480px;user-select:none}.mobile-controls button{min-width:64px;min-height:56px;background:#07363b;border:2px solid #00ffff;color:#00ffff;border-radius:12px;font-size:1.3rem;font-weight:bold;touch-action:none;-webkit-user-select:none;user-select:none}.mobile-controls button:active{background:#00ffff;color:#000}.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:6px;justify-content:center}.dpad [data-key="ArrowUp"]{grid-column:2;grid-row:1}.dpad [data-key="ArrowLeft"]{grid-column:1;grid-row:2}.dpad [data-key="ArrowDown"]{grid-column:2;grid-row:2}.dpad [data-key="ArrowRight"]{grid-column:3;grid-row:2}
@media(hover:none),(pointer:coarse){.mobile-controls{display:flex}}
@media(max-width:650px){body{overflow-x:hidden!important;overflow-y:auto!important}#gameCanvas,canvas#game{display:block;margin:8px auto!important}#continueBtn{max-width:calc(100vw - 24px)}.mobile-controls{display:flex}h1{margin:8px 0!important}}
@media(max-width:650px){#gameCanvas{width:min(calc(100vw - 20px),calc((100svh - 245px) * 1.2),600px);max-height:calc(100svh - 245px);margin:8px auto!important}#message{height:auto;min-height:24px;margin:8px} .mobile-controls{margin:6px auto}}
</style>
</head>
<body>
  <h1>🚨 ¡INVASIÓN EXTRATERRESTRE DETECTADA!</h1>
  <canvas id="gameCanvas" width="600" height="500"></canvas>
  <div class="mobile-controls"><button data-key="ArrowLeft" aria-label="Izquierda">◀</button><button data-key=" " aria-label="Disparar">🔥 Disparar</button><button data-key="ArrowRight" aria-label="Derecha">▶</button></div>
<div id="message">Defiende el botón de continuar...</div>
  <button id="continueBtn">Continuar</button>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const message = document.getElementById("message");
const continueBtn = document.getElementById("continueBtn");

let player, bullets, enemies, enemyDir;
let gameOver = false;
let victory = false;
let lastShotTime = 0;
const shotCooldown = 400;
const limiteY = 430; // límite que los enemigos no deben cruzar

// AudioContext global
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playBeep(freq = 440, dur = 0.1, type = 'square') {
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

// Inicializar juego
function initGame() {
  player = { x: 280, y: 450, w: 40, h: 20, speed: 6 };
  bullets = [];
  enemies = [];
  enemyDir = 1;
  gameOver = false;
  victory = false;
  message.textContent = "Defiende el botón de continuar...";
  continueBtn.style.display = "none";

  // Crear enemigos
  for (let i = 0; i < 5; i++) {
    for (let j = 0; j < 8; j++) {
      enemies.push({ x: 60 + j * 60, y: 40 + i * 40, w: 30, h: 20, alive: true });
    }
  }
}

initGame();

// Movimiento del jugador
let leftPressed = false;
let rightPressed = false;
let spacePressed = false;

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") leftPressed = true;
  if (e.key === "ArrowRight") rightPressed = true;
  if (e.key === " " || e.key === "Spacebar") spacePressed = true;
});

document.addEventListener("keyup", (e) => {
  if (e.key === "ArrowLeft") leftPressed = false;
  if (e.key === "ArrowRight") rightPressed = false;
  if (e.key === " " || e.key === "Spacebar") spacePressed = false;
});

// Disparo con cooldown
function shoot() {
  const now = Date.now();
  if (now - lastShotTime < shotCooldown) return;
  lastShotTime = now;
  bullets.push({ x: player.x + player.w / 2 - 2, y: player.y - 10, w: 4, h: 10 });
  playBeep(600, 0.05, 'square');
}

// Actualizar juego
function update() {
  if (gameOver || victory) return;

  if (leftPressed && player.x > 0) player.x -= player.speed;
  if (rightPressed && player.x + player.w < canvas.width) player.x += player.speed;
  if (spacePressed) shoot();

  bullets.forEach(b => b.y -= 6);
  bullets = bullets.filter(b => b.y > -10);

  let borde = false;
  enemies.forEach(e => {
    if (!e.alive) return;
    e.x += enemyDir * 1.5;
    if (e.x < 10 || e.x + e.w > canvas.width - 10) borde = true;
  });
  if (borde) {
    enemyDir *= -1;
    enemies.forEach(e => { if (e.alive) e.y += 15; });
  }

  // Colisiones
  bullets.forEach(b => {
    enemies.forEach(e => {
      if (e.alive && b.x < e.x + e.w && b.x + b.w > e.x &&
          b.y < e.y + e.h && b.y + b.h > e.y) {
        e.alive = false;
        b.y = -20;
        playBeep(800, 0.08, 'sine');
      }
    });
  });

  // Verificar victoria
  if (enemies.every(e => !e.alive)) {
    victory = true;
    message.textContent = "✅ Has repelido la invasión. El botón ha sido restaurado.";
    continueBtn.style.display = "block";
  }

  // Verificar derrota
  if (enemies.some(e => e.y + e.h > limiteY)) {
    gameOver = true;
    message.textContent = "💀 Has sido derrotado. ¡Debes intentarlo de nuevo!";
    setTimeout(initGame, 1000);
  }
}

// Dibujar
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Límite
  ctx.strokeStyle = "#ff0000";
  ctx.lineWidth = 2;
  ctx.setLineDash([5,3]);
  ctx.beginPath();
  ctx.moveTo(0, limiteY);
  ctx.lineTo(canvas.width, limiteY);
  ctx.stroke();
  ctx.setLineDash([]);

  // Jugador
  ctx.fillStyle = "#00ffff";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  // Balas
  ctx.fillStyle = "#ff3366";
  bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

  // Enemigos como ovnis
  enemies.forEach(e => {
    if (!e.alive) return;
    // cuerpo
    ctx.fillStyle = "#00ff00";
    ctx.beginPath();
    ctx.ellipse(e.x + e.w/2, e.y + e.h/2, e.w/2, e.h/2.5, 0, 0, Math.PI*2);
    ctx.fill();
    // cúpula
    ctx.fillStyle = "#00ffff";
    ctx.beginPath();
    ctx.arc(e.x + e.w/2, e.y + e.h/2 - 5, e.w/4, 0, Math.PI, true);
    ctx.fill();
  });
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();

continueBtn.addEventListener("click", () => {
  window.location.href = "error de interaccion 6.html";
});
</script>

<script>
(function(){
  const pressed=new Map();
  document.querySelectorAll('.mobile-controls [data-key]').forEach(btn=>{
    const key=btn.dataset.key;
    const release=()=>{if(!pressed.has(btn))return;pressed.delete(btn);document.dispatchEvent(new KeyboardEvent('keyup',{key,bubbles:true}));};
    btn.addEventListener('pointerdown',e=>{e.preventDefault();if(pressed.has(btn))return;pressed.set(btn,true);try{btn.setPointerCapture(e.pointerId)}catch(_){}document.dispatchEvent(new KeyboardEvent('keydown',{key,bubbles:true}));});
    btn.addEventListener('pointerup',release);btn.addEventListener('pointercancel',release);btn.addEventListener('lostpointercapture',release);
  });
  window.addEventListener('blur',()=>{for(const btn of [...pressed.keys()])document.dispatchEvent(new KeyboardEvent('keyup',{key:btn.dataset.key,bubbles:true}));pressed.clear()});
})();
</script>
</body>
</html>
