<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Principal</title>

  <style>
    body {
      background: linear-gradient(135deg, #000, #1a1a1a);
      color: #00ffcc;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 10px #00ffcc;
    }

    p {
      max-width: 500px;
      opacity: 0.85;
    }

    .btn {
      margin-top: 2rem;
      padding: 1rem 2rem;
      background: #00ffcc;
      border: none;
      color: #111;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: 0.3s;
    }

    .btn:hover {
      background: #ff0066;
      color: #fff;
      box-shadow: 0 0 15px #ff0066;
    }

    .eventos {
      margin-top: 3rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .eventos button {
      width: 250px;
      padding: 0.7rem;
      background: #222;
      border: 2px solid #00ffcc;
      color: #00ffcc;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .eventos button:hover {
      background: #00ffcc;
      color: #000;
      transform: scale(1.05);
    }

    /* CONTROLES DE MUSICA */

    .audio-controls {
      display: flex;
      gap: 12px;
      margin-top: 25px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .audio-controls button {
      padding: 10px 18px;
      background: #111;
      border: 1px solid #00ffcc;
      color: #00ffcc;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      transition: 0.3s;
    }

    .audio-controls button:hover {
      background: #00ffcc;
      color: #000;
      box-shadow: 0 0 12px #00ffcc;
    }

    #musicStatus {
      font-size: 12px;
      margin-top: 12px;
      color: #888;
    }

  </style>
</head>

<body>

  <h1>🔷 Menú Principal</h1>

  <p>
    ¡Bienvenido al menú principal!<br>
    Has demostrado una perseverancia increíble.<br><br>
    Desde aquí puedes continuar o acceder directamente a los desafíos principales.
  </p>

  <button class="btn" onclick="irAContinuar()">Continuar</button>

  <div class="eventos">
    <button onclick="go('laberinto.html')">Laberinto</button>
    <button onclick="go('frogger.html')">Frogger</button>
    <button onclick="go('snake.html')">Snake</button>
    <button onclick="go('space_invaders.html')">Space Invaders</button>
    <button onclick="go('asteroids.html')">Asteroids</button>
    <button onclick="go('boton_roto.html')">Botón Roto</button>
  </div>

  <!-- CONTROLES DE MUSICA -->

  <div class="audio-controls">
    <button id="playMusic">🎵 Activar música</button>
    <button id="stopMusic">🔇 Detener música</button>
  </div>

  <div id="musicStatus">Música desactivada</div>


  <!-- MOTOR MUSICAL STRUDEL -->

  <script src="https://unpkg.com/@strudel/web@1.0.3"></script>

  <script>

    // 🔒 BLOQUEO AUTOMÁTICO
    // Solo se puede entrar si unlockedMenu = true

    if (localStorage.getItem("unlockedMenu") !== "true") {
      window.location.href = "index.html";
    }


    // NAVEGACIÓN

    function irAContinuar() {
      window.location.href = "error de interaccion 6.html";
    }

    function go(url) {
      window.location.href = url;
    }


    // 🎵 SISTEMA DE MUSICA STRUDEL

    let strudelInitialized = false;
    let musicPlaying = false;

    const playButton = document.getElementById("playMusic");
    const stopButton = document.getElementById("stopMusic");
    const musicStatus = document.getElementById("musicStatus");


    // ACTIVAR MUSICA

    playButton.addEventListener("click", async function() {

      try {

        if (!strudelInitialized) {

          musicStatus.textContent = "Inicializando motor musical...";

          await initStrudel();

          strudelInitialized = true;
        }

        // Evitar duplicar la música
        hush();

        // Crear música ambiental electrónica
        stack(

          // Bajo electrónico
          note("c2 ~ g2 ~ c2 ~ eb2 ~")
            .s("sawtooth")
            .lpf(250)
            .gain(0.13),

          // Melodía ambiental
          note("c4 eb4 g4 bb4 g4 eb4 c4 ~")
            .s("triangle")
            .gain(0.09),

          // Acordes ambientales
          note("<c3 eb3 g3 bb3>")
            .s("sine")
            .gain(0.10)

        ).slow(2).play();

        musicPlaying = true;

        musicStatus.textContent = "♪ Música ambiental reproduciéndose";

        playButton.textContent = "🎵 Reiniciar música";

      } catch (error) {

        console.error("Error al iniciar Strudel:", error);

        musicStatus.textContent = "Error al cargar la música. Revisa tu conexión.";

      }

    });


    // DETENER MUSICA

    stopButton.addEventListener("click", function() {

      if (strudelInitialized && musicPlaying) {

        hush();

        musicPlaying = false;

        musicStatus.textContent = "Música detenida";

        playButton.textContent = "🎵 Activar música";

      }

    });

  </script>

</body>
</html>
